plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

sourceSets.main.resources {
    srcDir('src/generated/resources')

    // Development-only resources must not end up in the release JAR.
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    /*
     * Modern Industrialization and GrandPower.
     *
     * MI publishes its normal development artifact as:
     * aztech:Modern-Industrialization:<version>
     */
    maven {
        name = "ModMaven"
        url = uri("https://modmaven.dev")

        content {
            includeGroup "aztech"
            includeGroup "dev.technici4n"
        }
    }

    /*
     * GuideME is published to Maven Central.
     */
    mavenCentral()

    /*
     * KubeJS.
     */
    maven {
        name = "LatvianDev"
        url = uri("https://maven.latvian.dev/releases")

        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }

    /*
     * Some transitive KubeJS dependencies are available through JitPack.
     */
    maven {
        name = "JitPack"
        url = uri("https://jitpack.io")

        content {
            includeGroup "com.github.rtyley"
        }
    }
}

// Minecraft 1.21.1 uses Java 21.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        server {
            server()

            programArgument '--nogui'

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        gameTestServer {
            type = "gameTestServer"

            systemProperty(
                    'neoforge.enabledGameTestNamespaces',
                    project.mod_id
            )
        }

        data {
            data()

            programArguments.addAll(
                    '--mod',
                    project.mod_id,
                    '--all',
                    '--output',
                    file('src/generated/resources/').getAbsolutePath(),
                    '--existing',
                    file('src/main/resources/').getAbsolutePath()
            )
        }

        configureEach {
            systemProperty(
                    'forge.logging.markers',
                    'REGISTRIES'
            )

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

/*
 * localRuntime dependencies are present while testing the mod,
 * but are not exported as dependencies of MI Multiblock Editor.
 */
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    /*
     * Required dependency.
     *
     * This replaces:
     *
     * implementation files(
     *     "libs/Modern-Industrialization-2.5.5.jar"
     * )
     */
    implementation(
            "aztech:Modern-Industrialization:${modern_industrialization_version}"
    )

    /*
     * MI requires GuideME at runtime.
     *
     * We declare it explicitly for the development environment instead
     * of storing guideme-*.jar in libs/.
     *
     * MI's own Maven metadata also declares GuideME, but keeping this
     * explicit makes the development runtime requirement obvious.
     */
    localRuntime(
            "org.appliedenergistics:guideme:${guideme_version}"
    )

    /*
     * Required dependency and public scripting API.
     */
    api(
            "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    )
}

/*
 * Expands variables used by src/main/templates.
 */
var generateModMetadata = tasks.register(
        "generateModMetadata",
        ProcessResources
) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
    ]

    inputs.properties replaceProperties
    expand replaceProperties

    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register(
                'mavenJava',
                MavenPublication
        ) {
            from components.java
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

/*
 * Forward terminal input to the Minecraft dedicated server process,
 * so commands such as "list" and "stop" work when using runServer.
 */
tasks.named('runServer') {
    standardInput = System.in
}